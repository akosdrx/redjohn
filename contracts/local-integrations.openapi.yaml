components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CatalogModelDTO:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        context:
          anyOf:
          - type: integer
          - type: 'null'
          title: Context
        output:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output
        reasoning:
          type: boolean
          title: Reasoning
          default: false
        tool_call:
          type: boolean
          title: Tool Call
          default: true
      type: object
      required:
      - id
      - name
      title: CatalogModelDTO
    CatalogProviderDTO:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        base_url:
          type: string
          title: Base Url
        default_model:
          type: string
          title: Default Model
        auth_method:
          type: string
          enum:
          - api_key
          - oauth
          title: Auth Method
        models:
          items:
            $ref: '#/components/schemas/CatalogModelDTO'
          type: array
          title: Models
      type: object
      required:
      - id
      - name
      - base_url
      - default_model
      - auth_method
      - models
      title: CatalogProviderDTO
    CodexLoginDTO:
      properties:
        loginId:
          type: string
          title: Loginid
        verificationUrl:
          type: string
          title: Verificationurl
        userCode:
          type: string
          title: Usercode
        state:
          type: string
          enum:
          - pending
          - completed
          - failed
          title: State
      type: object
      required:
      - loginId
      - verificationUrl
      - userCode
      - state
      title: CodexLoginDTO
    CodexModelDTO:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - name
      title: CodexModelDTO
    CodexStatusDTO:
      properties:
        available:
          type: boolean
          title: Available
        authenticated:
          type: boolean
          title: Authenticated
        plan:
          anyOf:
          - type: string
          - type: 'null'
          title: Plan
        models:
          items:
            $ref: '#/components/schemas/CodexModelDTO'
          type: array
          title: Models
        login:
          anyOf:
          - $ref: '#/components/schemas/CodexLoginDTO'
          - type: 'null'
      type: object
      required:
      - available
      - authenticated
      - models
      title: CodexStatusDTO
    ErrorBody:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        details:
          additionalProperties: true
          title: Details
          type: object
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Request Id
      required:
      - code
      - message
      title: ErrorBody
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
      title: ErrorResponse
      type: object
    MemoryConfigDTO:
      properties:
        configured:
          type: boolean
          title: Configured
          default: false
        mode:
          type: string
          enum:
          - provider
          - local
