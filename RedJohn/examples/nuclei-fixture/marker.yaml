# SPDX-License-Identifier: Apache-2.0
# RedJohn's own benign lab fixture; no exploit, remote payload or CVE claim.
id: redjohn-loopback-marker
info:
  name: RedJohn harmless loopback marker
  author: RedJohn
  severity: info
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - redjohn-fixture-marker
      - type: word
        part: header
        case-insensitive: true
        words:
          - "x-redjohn-fixture: initial"
