name: RedJohn controller memory attribution

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    name: Controller memory Ubuntu 24.04 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
            python: '3.13.16'
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            python: '3.12.3'
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/RedJohn:${{ github.workspace }}/.github/scripts
      REDJOHN_TELEMETRY: '0'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      REDJOHN_REQUIRE_OS_MEMORY: '1'
      REDJOHN_TEST_CGROUP_ROOT: /sys/fs/cgroup/redjohn-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner_arch }}
      REDJOHN_CI_APPARMOR_PROFILE: redjohn-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner_arch }}
      REDJOHN_DNS_FIXTURE_NAME: redjohn-owned-fixture.test
      REDJOHN_RESOURCE_POOL_PATH: ${{ runner.temp }}/controller-profile-resources.sqlite3
      REDJOHN_NUCLEI_LOCK: ${{ github.workspace }}/RedJohn/.tools/nuclei/3.11.1/fixture-lock.json
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.lock
      - name: Bind exact source and install locked dependencies
        run: |
          python .github/scripts/ci.py snapshot
          python .github/scripts/ci.py run --name python-install -- timeout 15m python -m pip install -r .github/requirements-ci.lock
          python .github/scripts/ci.py run --name pip-check -- python -m pip check
          python .github/scripts/ci.py run --name controller-contracts -- python -m pytest RedJohn/tests/test_soak_memory_profile.py -q --junitxml=artifacts/controller-contracts.junit.xml
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-ubuntu-24.04-${{ runner.arch }}-playwright-1.58.0
      - name: Install only the controlled Chromium Nuclei and httpx dependencies
        id: engines
        run: |
          python .github/scripts/ci.py run --name linux-dependencies -- timeout 10m bash -c 'sudo apt-get update && sudo apt-get install -y bubblewrap iproute2 apparmor-utils && python -m playwright install --with-deps chromium'
          python .github/scripts/ci.py run --name nuclei-install -- python RedJohn/scripts/install-nuclei-pinned.py
          python .github/scripts/ci.py run --name nuclei-lock -- python RedJohn/scripts/create-nuclei-fixture-lock.py
          python .github/scripts/ci.py run --name httpx-install -- python RedJohn/scripts/install-projectdiscovery-pinned.py httpx
      - name: Delegate an owned cgroup and install the enforcing profile
        id: sandbox
        if: ${{ !cancelled() && steps.engines.outcome == 'success' }}
        run: |
          python .github/scripts/ci.py run --name linux-setup -- bash .github/scripts/prepare-linux.sh
          python .github/scripts/ci.py run --name sandbox-setup -- python .github/scripts/sandbox.py prepare
      - name: Attest sandboxed Chromium namespace and memory capabilities
        id: capability
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        run: |
          task_python="$(command -v python)"
          task_home="$HOME"
          python .github/scripts/ci.py run --name controller-capability -- sudo -E env HOME="$task_home" bash .github/scripts/linux-tests.sh "$task_python" capability
      - name: Run fresh controllers sequentially inside unchanged kernel limits
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        run: |
          task_python="$(command -v python)"
          task_home="$HOME"
          sudo -E env HOME="$task_home" bash .github/scripts/controller-profile-linux.sh "$task_python"
      - name: Capture and clean only this job's delegated processes
        if: always()
        run: python .github/scripts/ci.py run --name controller-cleanup -- bash .github/scripts/cleanup-linux.sh
      - name: Remove the owned profile and recheck host restrictions
        if: ${{ always() && steps.sandbox.outcome != 'skipped' }}
        run: python .github/scripts/ci.py run --name sandbox-cleanup -- python .github/scripts/sandbox.py cleanup
      - name: Require complete commit-bound diagnostic evidence
        if: always()
        run: python .github/scripts/controller-summary.py
      - name: Preserve all counters logs source hashes JUnit and owner receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redjohn-controller-memory-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/**/*.json
            artifacts/**/*.log
            artifacts/**/*.txt
            artifacts/**/*.xml
          if-no-files-found: error
          retention-days: 14
