name: RedJohn live model CLI and TUI

on:
  workflow_call:
    inputs:
      model:
        description: 'Explicit bare OpenAI model identifier; empty records blocked evidence'
        required: false
        default: ''
        type: string
    secrets:
      REDJOHN_LIVE_MODEL_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      model:
        description: 'Explicit bare OpenAI model identifier; empty records blocked evidence'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: redjohn-live-model-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  live-model:
    name: Real provider CLI and Go TUI / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1 # Deliberately serialize optional real-provider workloads.
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
            python: '3.13.16'
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            python: '3.12.3'
    env:
      PYTHONPATH: ${{ github.workspace }}/RedJohn:${{ github.workspace }}/.github/scripts
      REDJOHN_TELEMETRY: '0'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      REDJOHN_LIVE_MODEL: ${{ inputs.model }}
      REDJOHN_TEST_CGROUP_ROOT: /sys/fs/cgroup/redjohn-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner_arch }}
      REDJOHN_CI_APPARMOR_PROFILE: redjohn-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner_arch }}
      REDJOHN_NUCLEI_LOCK: ${{ github.workspace }}/RedJohn/.tools/nuclei/3.11.1/fixture-lock.json
      REDJOHN_DNS_FIXTURE_NAME: redjohn-owned-fixture.test
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up the locked Python minor
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: .github/requirements-ci.lock
      - name: Bind evidence to source hashes and commit
        run: python .github/scripts/ci.py snapshot
      - name: Require explicit model and dedicated provider secret before installation
        id: credential
        env:
          REDJOHN_LIVE_MODEL_API_KEY: ${{ secrets.REDJOHN_LIVE_MODEL_API_KEY }}
        run: python .github/scripts/live-model-e2e.py --preflight
      - name: Install locked Python dependencies
        run: |
          python -m pip install -r .github/requirements-ci.lock
          python -m pip check
      - name: Set up locked Go for the actual native TUI source
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.1'
          cache-dependency-path: RedJohn/redjohn/interface/tui/go.sum
      - name: Cache version-pinned Chromium
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-ubuntu-24.04-${{ runner.arch }}-playwright-1.58.0
      - name: Install real Chromium, enforcing namespace tools and pinned Nuclei
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2 apparmor-utils
          python -m playwright install --with-deps chromium
          mkdir -p artifacts/tool-receipts
          python RedJohn/scripts/install-nuclei-pinned.py > artifacts/tool-receipts/nuclei.json
          python RedJohn/scripts/create-nuclei-fixture-lock.py
          cd RedJohn/redjohn/interface/tui
          timeout 8m go build -trimpath -o "$GITHUB_WORKSPACE/artifacts/redjohn-tui" ./cmd/redjohn-tui
      - name: Delegate only the owned cgroup
        id: delegation
        run: bash .github/scripts/prepare-linux.sh
      - name: Install enforcing job profile and require negative namespace controls
        id: sandbox
        run: python .github/scripts/sandbox.py prepare
      - name: Run genuine bounded model CLI and native terminal stop/resume E2E
        env:
          REDJOHN_LIVE_MODEL_API_KEY: ${{ secrets.REDJOHN_LIVE_MODEL_API_KEY }}
        run: |
          task_python="$(command -v python)"
          task_runner_home="$HOME"
          sudo -E env HOME="$task_runner_home" bash .github/scripts/live-model-linux.sh "$task_python"
      - name: Capture and clean only this job's delegated descendants
        if: ${{ always() && steps.delegation.outcome == 'success' }}
        run: bash .github/scripts/cleanup-linux.sh
      - name: Remove only the owned profile and recheck host protection
        if: ${{ always() && steps.sandbox.outcome != 'skipped' }}
        run: python .github/scripts/sandbox.py cleanup
      - name: Preserve blocked or real evidence, redacted terminal output and cleanup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redjohn-live-model-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/source.json
            artifacts/live-model/*.json
            artifacts/live-model/*.log
            artifacts/live-model/*.junit.xml
            artifacts/tool-receipts/*.json
            artifacts/apparmor-*.json
            artifacts/apparmor-policy.txt
            artifacts/cgroup-cleanup.json
          if-no-files-found: error
          retention-days: 14
