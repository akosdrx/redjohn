name: RedJohn native component smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redjohn-native-components-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Native smoke Ubuntu 24.04 ${{ matrix.arch }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
            python: '3.13.16'
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            python: '3.12.3'
    env:
      PYTHONPATH: ${{ github.workspace }}/RedJohn:${{ github.workspace }}/.github/scripts
      REDJOHN_TELEMETRY: '0'
      OPENAI_AGENTS_DISABLE_TRACING: '1'
      REDJOHN_REQUIRE_NETWORK_SCANNER_E2E: '1'
      REDJOHN_REQUIRE_SERVICE_SCANNER_E2E: '1'
      REDJOHN_REQUIRE_PREPARATION_E2E: '1'
      REDJOHN_REQUIRE_OS_MEMORY: '1'
      REDJOHN_TEST_CGROUP_ROOT: /sys/fs/cgroup/redjohn-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner_arch }}
      REDJOHN_CI_APPARMOR_PROFILE: redjohn-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner_arch }}
      REDJOHN_CI_CAPABILITIES: ${{ github.workspace }}/artifacts/capabilities.json
      REDJOHN_RESOURCE_POOL_PATH: ${{ github.workspace }}/.ci-state/native-resources.sqlite3
      REDJOHN_OS_MEMORY_MEASUREMENTS: ${{ github.workspace }}/artifacts/native-os-memory
      REDJOHN_DNS_FIXTURE_NAME: redjohn-owned-fixture.test
      GOMAXPROCS: '2'
      GOTOOLCHAIN: local
    steps:
      - name: Check out the exact native smoke commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up the same locked Python and pip cache
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.lock
            RedJohn/requirements-assessment.lock
            RedJohn/pyproject.toml
      - name: Set up the same locked Go toolchain and module cache
        id: go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.1'
          cache-dependency-path: RedJohn/redjohn/interface/tui/go.sum
      - name: Bind source hashes and the explicit limited native scope
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          python .github/scripts/ci.py snapshot
          python .github/scripts/native-summary.py scope
      - name: Install complete locked Python dependencies
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        id: dependencies
        run: |
          python .github/scripts/ci.py run --name python-install -- timeout 15m python -m pip install -r .github/requirements-ci.lock
          python .github/scripts/ci.py run --name pip-check -- python -m pip check
          python .github/scripts/ci.py run --name native-ci-contracts -- python -m unittest discover -s .github/tests -v
      - name: Install native build and isolation dependencies without Chromium
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        id: system
        run: python .github/scripts/ci.py run --name native-linux-dependencies -- timeout 10m bash -c 'sudo apt-get update && sudo apt-get install -y bubblewrap iproute2 apparmor-utils libpcap0.8t64 build-essential pkg-config flex bison'
      - name: Install Naabu then dnsx then the owned Nmap fixture build then kube-bench
        if: ${{ !cancelled() && steps.system.outcome == 'success' && steps.go.outcome == 'success' }}
        id: engines
        run: |
          python .github/scripts/ci.py run --name network-scanner-install -- timeout 10m bash .github/scripts/install-network-scanners.sh
          python .github/scripts/ci.py run --name service-scanner-install -- timeout 20m bash .github/scripts/install-service-scanners.sh
          python .github/scripts/ci.py run --name preparation-tool-install -- timeout 5m bash .github/scripts/install-preparation-tools.sh
      - name: Delegate only this run's owned cgroup and fixture identities
        if: ${{ !cancelled() && steps.engines.outcome == 'success' }}
        id: delegation
        run: python .github/scripts/ci.py run --name linux-setup -- bash .github/scripts/prepare-linux.sh
      - name: Install the job-owned enforcing AppArmor profile and negative controls
        if: ${{ !cancelled() && steps.delegation.outcome == 'success' }}
        id: sandbox
        run: python .github/scripts/ci.py run --name sandbox-setup -- python .github/scripts/sandbox.py prepare
      - name: Attest UID drop, global restrictions, namespace and cgroup for native scope
        if: ${{ !cancelled() && steps.sandbox.outcome == 'success' }}
        id: capability
        run: |
          task_python="$(command -v python)"
          task_home="$HOME"
          python .github/scripts/ci.py run --name native-capability -- sudo -E env HOME="$task_home" bash .github/scripts/linux-tests.sh "$task_python" native-capability
      - name: Run only the declared native component suites sequentially
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        run: |
          task_python="$(command -v python)"
          task_home="$HOME"
          sudo -E env HOME="$task_home" bash .github/scripts/linux-tests.sh "$task_python" native
      - name: Record and clean only this job's owned cgroup processes
        if: always()
        run: python .github/scripts/ci.py run --name native-cleanup -- bash .github/scripts/cleanup-linux.sh
      - name: Remove only the job-owned AppArmor profile and verify restrictions remain enabled
        if: ${{ always() && steps.sandbox.outcome != 'skipped' }}
        run: python .github/scripts/ci.py run --name sandbox-cleanup -- python .github/scripts/sandbox.py cleanup
      - name: Require strict per-suite native evidence and report limited scope
        if: always()
        run: python .github/scripts/native-summary.py summary
      - name: Preserve commit-bound native logs, JUnit, tool and resource receipts on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: redjohn-native-components-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/**/*.json
            artifacts/**/*.log
            artifacts/**/*.txt
            artifacts/**/*.xml
          if-no-files-found: error
          retention-days: 14
