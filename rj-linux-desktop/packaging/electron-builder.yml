extends: ../packaging/electron-builder.yml
extraMetadata:
  homepage: https://localhost/redjohn
  desktopName: redjohn.desktop
directories:
  output: ../rj-linux-desktop/release
linux:
  executableName: redjohn
  syncDesktopName: true
  category: Development
  target:
    - deb
    - AppImage
  description: RedJohn local security-assessment desktop for Debian, Ubuntu and Kali
  synopsis: RedJohn desktop
  maintainer: RedJohn <redjohn@localhost>
deb:
  packageName: redjohn
  artifactName: RedJohn-${version}-${arch}.${ext}
  compression: zst
  afterInstall: ../rj-linux-desktop/packaging/after-install.sh
  appArmorProfile: ../rj-linux-desktop/packaging/redjohn.apparmor
  # Runtime deps for the core app only: Electron/Chromium GUI libs, libssl3 for
  # the engine's HTTPS (providers + on-demand tool downloads) and libseccomp2 for
  # the kept builtin:exec sandbox. Assessment tools are not bundled, so their
  # former libs (libyaml-0-2, libreadline8, libpq5, libpcap0.8 for Metasploit and
  # capture tools) are pulled in by apt only if the user installs those tools.
  depends:
    - libc6 (>= 2.38)
    - libgtk-3-0t64 | libgtk-3-0
    - libnss3
    - libxss1
    - libasound2t64 | libasound2
    - libssl3t64 | libssl3
    - libseccomp2
    - libgbm1
