[project]
name = "redjohn-agent"
version = "1.7.0"
description = "Open-source AI Hackers for your apps"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
  { name = "RedJohn", email = "hi@redjohn.ai" },
]
keywords = [
  "cybersecurity",
  "security",
  "vulnerability",
  "scanner",
  "pentest",
  "agent",
  "ai",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "openai-agents[litellm]>=0.19.0,<0.20",
  "openai>=2.45.0,<3",
  "litellm>=1.101.0",
  "google-auth>=2.0.0",
  "boto3>=1.28.0",
  "pydantic>=2.11.3",
  "pydantic-settings>=2.13.0",
  "rich",
  "docker>=7.1.0",
  "requests>=2.32.0",
  "cvss>=3.2",
  "caido-sdk-client>=0.2.0",
  "markdown-it-py>=3.0.0",
  "reportlab>=4.0",
  "pypdf>=5.0",
  # Cap <49: 49.x drops the universal2 macOS wheel (arm64-only), which breaks
  # the Intel macOS (macos-x86_64) release build's `uv sync --frozen`.
  "cryptography>=48.0.1,<49",
  "pyyaml>=6.0",
  "httpx>=0.28.0",
  "openviking>=0.5.1.1,<0.6",
]

[project.scripts]
redjohn = "redjohn.interface.main:main"
rj = "redjohn.interface.main:main"

[project.optional-dependencies]
browser = ["playwright==1.58.0"]
graphql = ["graphql-core==3.3.0"]

[dependency-groups]
dev = [
  "mypy>=1.16.0",
  "ruff>=0.11.13",
  "pyright>=1.1.401",
  "bandit>=1.8.3",
  "pre-commit>=4.2.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "types-requests>=2.32",
]
packaging = [
  "pyinstaller>=6.17.0; python_version >= '3.12' and python_version < '3.15'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redjohn"]
# The prebuilt viewer bundle under redjohn/interface/viewer/static/ ships automatically
# (hatchling includes non-.py files under the package). The Vite SOURCE lives
# under the package dir too (redjohn/interface/viewer/frontend/) but must never ship in the wheel.
exclude = [
  "redjohn/interface/viewer/frontend",
  "redjohn/interface/viewer/frontend/**",
  # Rust TUI SOURCE lives under the package dir but must never ship in the wheel;
  # the compiled sidecar is force-included as redjohn/bin/redjohn-tui instead.
  "redjohn/interface/tui/src/**",
  "redjohn/interface/tui/target/**",
  "redjohn/interface/tui/Cargo.toml",
  "redjohn/interface/tui/Cargo.lock",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/tui_sidecar_hook.py"

# ============================================================================
# Type Checking Configuration
# ============================================================================

[tool.mypy]
python_version = "3.12"
strict = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Allow some flexibility for third-party libraries
[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "rich.*",
    "jinja2.*",
    "cvss.*",
    "docker.*",
    "caido_sdk_client.*",
    "pydantic_settings.*",
    "reportlab.*",
    "pypdf.*",
    "yaml.*",
    "pygments.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# ============================================================================
# Ruff Configuration (Fast Python Linter & Formatter)
# ============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "migrations",
    "skills",
    "skills/**",
]

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "PERF", # Perflint
    "RUF", # Ruff-specific rules
]

ignore = [
    "S101",   # Use of assert
    "S104",   # Possible binding to all interfaces
    "S301",   # Use of pickle
    "COM812", # Missing trailing comma (handled by formatter)
    "ISC001", # Single line implicit string concatenation (handled by formatter)
    "PLR0913", # Too many arguments to function call
    "PLR0917", # Too many positional arguments
    "TRY003",  # Avoid specifying long messages outside the exception class
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "G004",    # Logging statement uses f-string
    "PLR2004", # Magic value used in comparison
    "SLF001",  # Private member accessed
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "E501", "T201", "INP001",
    "BLE001", "E402", "I001", "PIE810", "PLR0912", "PLR0915", "PLW1510",
    "PLW2901", "PTH105", "PTH115", "Q003", "S110", "S202", "S310",
    "S603", "S607", "SIM102", "TC003",
]
# Hatchling loads the build hook by path, not as an importable package.
"scripts/tui_sidecar_hook.py" = ["INP001"]
# Stdlib HTTP handler overrides (do_GET/do_POST).
"redjohn/interface/auth_cli.py" = ["N802", "E501"]
# Stdlib HTTP handler overrides (do_GET/do_POST) and lazy imports that avoid a
# circular dependency with redjohn.telemetry / redjohn.interface.viewer.report_pdf.
"redjohn/interface/viewer/server.py" = ["N802", "PLC0415", "PLR0911", "PLR0912"]
"redjohn/interface/cloud/payment_proxy.py" = ["N802"]
# Lazy telemetry import to avoid importing PostHog before the viewer starts.
"redjohn/interface/viewer/cli.py" = ["PLC0415", "E501", "ICN001"]
# Lazy imports inside functions to avoid circular dependency with
# redjohn.telemetry / redjohn.report.dedupe / cvss.
"redjohn/tools/notes/tools.py" = ["PLC0415", "TC002"]
"redjohn/tools/finish/tool.py" = ["PLC0415", "TC002"]
"redjohn/tools/reporting/tool.py" = ["PLC0415", "TC002", "E501", "ISC004"]
# Lazy imports of redjohn.tools.mcp.client avoid a circular import (client imports
# the session module at module load).
"redjohn/tools/mcp/session.py" = ["PLC0415"]
# call_mcp is a chain of guard clauses that each return an error string.
"redjohn/tools/mcp/agent_tools.py" = ["PLR0911"]
"redjohn/tools/**/*.py" = [
    "ARG001", # Unused function argument (tools may have unused args for interface consistency)
]
# Custom Docker subclass duplicates parent body; some imports are for annotations.
# Backend factories import their backend's deps lazily so deployments
# that pick a different backend don't need every backend's libs installed.
"redjohn/runtime/backends.py" = ["PLC0415"]
"redjohn/runtime/docker_client.py" = [
    "TC002",  # Manifest, Container imported for annotations
    "TC003",  # uuid imported for annotation
]
# SDK function-tool wrappers: the SDK calls get_type_hints() at registration
# time to derive the JSON schema, which evaluates annotations at runtime —
# so RunContextWrapper / Tool / TResponseInputItem must be imported eagerly,
# not under TYPE_CHECKING.
"redjohn/tools/todo/tools.py" = ["TC002"]
"redjohn/tools/thinking/tool.py" = ["TC002"]
"redjohn/tools/web_search/tool.py" = ["TC002"]
"redjohn/tools/cve/tool.py" = ["TC002", "PLR0911", "PLR0912", "PLR0915", "ICN001"]
"redjohn/runtime/local_backend.py" = ["TC002", "TC003", "PLC0415", "TRY300", "E501", "PLR0912", "PLR0915"]
"redjohn/runtime/session_manager.py" = ["PLR0915"]
"redjohn/tools/proxy/tools.py" = ["TC002", "PLR0911"]
# The generated Caido GraphQL schema is slow to import, so the SDK is imported
# on first proxy call instead of at module scope (keeps it off the launch path).
"redjohn/tools/proxy/caido_api.py" = ["PLC0415"]
"redjohn/runtime/caido_bootstrap.py" = ["PLC0415"]
"redjohn/tools/agents_graph/tools.py" = ["TC002", "E501"]
"redjohn/agents/factory.py" = ["TC002"]
# Entry point: ``Path`` is used at runtime by the typing of the
# session_manager call; importing under TYPE_CHECKING would defer
# resolution past where mypy needs it.
"redjohn/core/runner.py" = ["TC003", "PLR0912", "PLR0915", "PLC0415"]
"redjohn/core/agents.py" = ["PLC0415"]
"redjohn/core/hooks.py" = ["E501"]
"redjohn/core/inputs.py" = ["ISC004", "E501"]
# ReportState carries scan artifact/report fields and
# a runtime ``Callable`` annotation on ``vulnerability_found_callback``.
"redjohn/report/state.py" = ["TC003", "PLR0912", "PLR0915", "E501", "PERF401", "PLC0415"]
"redjohn/report/coverage.py" = ["E501"]
"redjohn/report/usage.py" = ["PLC0415"]
# LiteLLM and the Docker SDK are imported on first use, not at module scope:
# both cost seconds to import and neither is needed until a model call is made
# (or, for Docker, unless the Docker runtime backend is in use).
"redjohn/core/execution.py" = ["PLC0415"]
"redjohn/report/pricing.py" = ["PLC0415"]
"redjohn/llm/compaction.py" = ["PLC0415"]
"redjohn/llm/context_budget.py" = ["PLC0415"]
# Lazy import of redjohn.config.models avoids a circular dependency between the
# report pipeline and the config layer.
"redjohn/report/dedupe.py" = ["PLC0415"]
"redjohn/telemetry/logging.py" = ["PLC0415"]
"redjohn/config/models.py" = ["PLC0415"]
# LiteLLM is imported lazily: the request log is wired at startup on every
# route, including the native OpenAI ones that never load LiteLLM.
"redjohn/llm/request_log.py" = ["PLC0415"]
# Heavy inference deps (httpx, openai) imported lazily so auth-status checks
# don't pull them in.
"redjohn/config/codex.py" = ["PLC0415"]
"redjohn/config/grok.py" = ["PLC0415"]
# Interface utility branches per scope-mode / target-type combination;
# splitting would obscure the decision tree without simplifying it.
"redjohn/interface/utils.py" = ["PLR0912", "BLE001", "PLC0415", "ISC004"]
# CLI / TUI / main keep extensive lazy imports + broad exception
# swallows for resilience around terminal-rendering errors.
"redjohn/interface/cli.py" = ["BLE001", "PLC0415"]
"redjohn/interface/scan_setup.py" = ["PLC0415"]
"redjohn/interface/main.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915"]
"redjohn/interface/cli_args.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915", "E501"]
"redjohn/interface/environment.py" = ["BLE001", "PLC0415", "PLR0912", "PLR0915"]
"redjohn/interface/cloud/render.py" = ["ISC004"]
"redjohn/interface/cloud/session.py" = ["E501"]
"redjohn/interface/cloud/source_upload.py" = ["E501"]
# The Go TUI runtime and backend controller import interface modules lazily so
# the sidecar entry point stays fast and avoids circular imports.
"redjohn/interface/interactive.py" = ["PLC0415"]
"redjohn/interface/tui/runtime.py" = ["PLC0415", "E501"]
"redjohn/interface/tui/backend/controller.py" = ["PLC0415"]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["redjohn"]
known-third-party = ["pydantic"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================================
# PyRight Configuration (Alternative type checker)
# ============================================================================

[tool.pyright]
include = ["redjohn"]
exclude = ["**/__pycache__", "build", "dist"]
pythonVersion = "3.12"
pythonPlatform = "Linux"

typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportGeneralTypeIssues = true
reportPropertyTypeMismatch = true
reportFunctionMemberAccess = true
reportMissingParameterType = true
reportMissingTypeArgument = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

# ============================================================================
# Black Configuration (Code Formatter)
# ============================================================================

[tool.black]
line-length = 100
target-version = ['py312']
include = '\\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ============================================================================
# isort Configuration (Import Sorting)
# ============================================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["redjohn"]
known_third_party = ["pydantic", "litellm"]

# ============================================================================
# Bandit Configuration (Security Linting)
# ============================================================================

[tool.bandit]
# Tests are covered by ruff's flake8-bandit rules (see per-file-ignores above),
# which is where fixture tokens and loopback URL opens are already waived.
exclude_dirs = ["docs", "build", "dist", "tests"]
skips = ["B101", "B601", "B404", "B603", "B607"]  # Skip assert, shell injection, subprocess import and partial path checks
severity = "medium"
